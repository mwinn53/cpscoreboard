[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cpscoreboard"
version = "0.2.0"
description = "Live CyberPatriot scoreboard dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",  # form posts
    "boto3>=1.34",              # SES in production
    "tzdata>=2024.1",           # time zones for display (Windows and slim images have none)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
