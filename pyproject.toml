[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cpscoreboard"
version = "0.2.0"
description = "Live CyberPatriot scoreboard dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",  # form posts
    "boto3>=1.34",              # SES in production
    "tzdata>=2024.1",           # time zones for display (Windows and slim images have none)
    "cryptography>=42",
    "alembic>=1.13",
    "maxminddb>=2.5",           # reads the offline IP geolocation database (app/geo.py)
    "numpy>=2.0",               # the Analysis tab's statistics (app/analysis_stats.py)
    "scipy>=1.14",              # rank tests, exact p-values, BCa bootstrap intervals
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.16"]  # httpx2: Starlette's TestClient prefers it (no deprecation warning)

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
