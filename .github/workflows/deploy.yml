name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Skipped until the repo variables from `terraform output github_variables_commands` are set.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS role; no stored AWS keys
    env:
      AWS_REGION: us-east-1
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}
            ${{ vars.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: bash deploy/ssm-deploy.sh

      - name: Smoke test
        if: vars.SITE_URL != ''
        # First deploy may take a minute while Caddy obtains the TLS certificate.
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "${{ vars.SITE_URL }}/healthz"
