services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    volumes:
      # Captures land in ./captures on the host, so they survive container rebuilds.
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      APP_ENV: dev
      SCRAPE_MODE: live
      # Registration emails go to Mailpit; read them at http://localhost:8025.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: noreply@cpscoreboard.test
      # Dev-only admin token: register at /register, then claim admin at /admin/claim.
      ADMIN_BOOTSTRAP_TOKEN: dev-admin-token-not-secret
      ADMIN_NOTIFY_EMAIL: admin@cpscoreboard.test
      # Set to "false" to skip registration while developing the dashboard.
      AUTH_ENABLED: "true"

  mailpit:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
