services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    volumes:
      # Captures land in ./captures on the host, so they survive container rebuilds.
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      APP_ENV: dev
      SCRAPE_MODE: live
      # Used from milestone 4 (registration emails); open http://localhost:8025 to read them.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"

  mailpit:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
